stickers:
- id: kei_neutral
  file: assets/stickers/tendou_kei/CH0335_noweapon_spr_01.png
  label: 平静／自然陈述
  description: 睁眼闭口、神态平静，无明显脸红或汗滴；可配自然说明、询问或克制评论，台词提及问题和不满也不等于表情正在生气。
