  - neutral
  - composed
  - restrained
  fallback_cues: []
  enabled: true
  affect:
    primary: neutral
    secondary:
    - composed
  intensity: mild
  dialogue_act:
  - statement
  - question
  - comment
  expression_style:
  - restrained
  usage_scenarios:
